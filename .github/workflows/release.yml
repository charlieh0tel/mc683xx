name: release

# A release (docs/releasing.md).  A `v*` tag builds the Python
# package's wheels and sdist, publishes them to PyPI, then publishes
# the crates to crates.io and the npm package to npm (each's first
# release by hand), once the `gate` job has passed; a manual run only
# builds the wheels and sdist, as artifacts to inspect.  CI's `package`
# job dry-runs the crates' publish, and its `wasm` job builds and tests
# the npm package.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The bindings' crate; its pyproject.toml sets the features (abi3
  # from Python 3.10), as `make python` builds it.
  PYTHON_MANIFEST: crates/cpu32-py/Cargo.toml
  # The Makefile's pin (PYTHON_TOOLS).
  MATURIN_VERSION: "1.15.0"
  PYTEST_VERSION: "9.1.1"
  # The oldest Python the abi3 wheel claims, so the tests check it.
  TEST_PYTHON: "3.10"
  # The Node CI's `wasm` job tests the npm package with, and the npm
  # that publishes it: trusted publishing needs npm 11.5.1 or later,
  # and Node 22 comes with npm 10.
  NODE_VERSION: "22"
  NPM_VERSION: "11.21.1"

jobs:
  gate:
    # Nothing publishes unless the tagged commit is on main, the tag
    # names the workspace's version, and CI passed on that commit
    # (docs/releasing.md).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "$GITHUB_SHA ($GITHUB_REF_NAME) is not on main"; exit 1; }
      - name: Check the tag names the workspace's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || \
            { echo "tag $GITHUB_REF_NAME is not v$version (Cargo.toml)"; exit 1; }
      - name: Check CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest run of ci.yml for this commit's push to main, as
          # "status/conclusion"; a re-run of it updates the same run.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | select(.) | "\(.status)/\(.conclusion)"')
          echo "ci on main for $GITHUB_SHA: ${run:-none}"
          test "$run" = completed/success || { echo "ci has not passed on $GITHUB_SHA"; exit 1; }

  wheels:
    # One abi3 wheel per platform.  The compiler is the one
    # rust-toolchain.toml names.  Wheels this runner can load run the
    # Python tests; cross-built ones are only built.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, test: false }
          - { os: macos-latest, target: x86_64, test: false }
          - { os: macos-latest, target: aarch64, test: true }
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TEST_PYTHON }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m ${{ env.PYTHON_MANIFEST }}
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist mc683xx
          python -m pip install pytest==${{ env.PYTEST_VERSION }}
          python -m pytest -q crates/cpu32-py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist -m ${{ env.PYTHON_MANIFEST }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.TEST_PYTHON }}
      # What pip builds on a platform without a wheel: it must carry the
      # stubs and py.typed, which only the python-source layout puts in
      # the sdist (crates/cpu32-py/pyproject.toml).
      - name: Build a wheel from the sdist and check its stubs
        shell: bash
        run: |
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
          python - "$RUNNER_TEMP"/from-sdist/*.whl <<'EOF'
          import sys
          import zipfile

          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          missing = sorted({"mc683xx/__init__.pyi", "mc683xx/py.typed"} - names)
          if missing:
              sys.exit(f"the sdist's wheel lacks {missing}")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  pypi:
    # Trusted publishing (OIDC): no token.  It publishes only once PyPI
    # trusts this workflow and the `pypi` environment exists
    # (docs/releasing.md), and only from a tag that passed `gate`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mc683xx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates:
    # crates.io by trusted publishing (OIDC): a short-lived token, none
    # stored.  It publishes only once crates.io trusts this workflow for
    # every crate and the `crates-io` environment exists
    # (docs/releasing.md), and only from a tag that passed `gate`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, pypi]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/mc683xx-cpu32
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Cargo uploads in dependency order, waiting for each crate to
      # reach the index; the toolchain is rust-toolchain.toml's.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    # npm by trusted publishing (OIDC): no token, and a provenance
    # statement.  It publishes only once npm trusts this workflow for
    # the package and the `npm` environment exists (docs/releasing.md),
    # and only from a tag that passed `gate`, whose `ci` run tested the
    # package (`make npm-test`).  After `pypi`, as `crates` is, but not
    # after `crates`: a release whose `crates` job fails for a crate
    # new to it, published by hand, still publishes here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, pypi]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/mc683xx
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          # No cache a publishing job could be handed.
          package-manager-cache: false
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      # As CI's `wasm` job: the target on rust-toolchain.toml's
      # toolchain, the wasm-bindgen CLI at the crate's exact version.
      - run: |
          cargo --version
          rustup target add wasm32-unknown-unknown
      - run: |
          sh scripts/install-wasm-bindgen.sh "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen" >> "$GITHUB_PATH"
      - run: make npm-package
      - name: Check the package's version is the tag's
        working-directory: crates/wasm/pkg
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || \
            { echo "tag $GITHUB_REF_NAME is not v$version (package.json)"; exit 1; }
      # npm refuses a prerelease without a dist-tag: one goes to `next`,
      # so `latest` stays the last release.  A release takes `latest` by
      # default, never named, as npm then refuses a version below one
      # already published (an older line's patch, docs/releasing.md).
      # A prerelease has a `-` before any build metadata (`+...`), which
      # may have one of its own.
      - name: Publish
        working-directory: crates/wasm/pkg
        run: |
          version=$(node -p 'require("./package.json").version')
          case "${version%%+*}" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
