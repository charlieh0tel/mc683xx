name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; no job here needs more.
permissions:
  contents: read

jobs:
  ci:
    # The shared definition, as smartclock's CI uses it.
    # rust-toolchain.toml pins the compiler; an empty fmt-toolchain
    # makes the fmt job read it too.  Pinned to the commit tag v1 named
    # when pinned, as the actions are.
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@7c4b23becb6d0a79ec6f23889eee567017e13081 # v1
    with:
      fmt-toolchain: ""
      audit: false
      check-args: "--workspace --all-targets"

  platforms:
    # The workspace's clippy and tests on the hosts the shared ci job
    # (Linux x86_64) does not cover: Windows x64 and Linux arm64, where
    # a consumer's CI builds and tests these crates too.  The compiler
    # is the one rust-toolchain.toml names.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  msrv:
    # The workspace builds on the minimum supported Rust, the
    # workspace's `rust-version` (docs/releasing.md), read from
    # Cargo.toml, ".0" added to a major.minor: a check, not the tests.
    # `+` overrides rust-toolchain.toml's pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the MSRV
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          case "$version" in
            *.*.*) ;;
            *) version="$version.0" ;;
          esac
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo +"$MSRV" check --workspace --all-targets

  oracle:
    # The Musashi differential runs (`make oracle`).  The fetch is one
    # pinned commit, shallow, so it is not cached.  The compiler is the
    # one rust-toolchain.toml names, which rustup installs on first use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make oracle

  semver:
    # The published crates' APIs against their last release on
    # crates.io (cargo-semver-checks): a breaking change needs a
    # version that allows it.  Until 1.0 the version is bumped only at
    # release, so a break reports here without failing the run.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  package:
    # The published crates package and build from their packages alone,
    # in dependency order, as `cargo publish --workspace` would upload
    # them (docs/releasing.md).  Members with `publish = false` are
    # skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --workspace --dry-run

  licenses:
    # The license texts in the published crates and the Python package
    # are byte-for-byte copies of the root's (`make licenses`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make licenses

  features:
    # The gdb stub builds for the bare CPU alone and for the chip
    # without the board (`make features`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make features

  docs:
    # The published crates' rustdoc with no warnings (`make docs`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docs

  python:
    # The Python package built and tested as release.yml's wheels job
    # tests a wheel (the same pins), on each platform it tests one, so
    # a test that fails on one fails here before a tag's release run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MATURIN_VERSION: "1.15.0"
      PYTEST_VERSION: "9.1.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --release --out dist -m crates/python/Cargo.toml
      - name: Test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist mc683xx
          python -m pip install pytest==${{ env.PYTEST_VERSION }}
          python -m pytest -q crates/python

  wasm:
    # The JavaScript bindings linted on wasm32 and built as the npm
    # package (`make wasm`), the package packed, installed and run in
    # Node and in headless Chrome (`make npm-test`), and its TypeScript
    # declarations compiled by consumers in Node, a browser and
    # CommonJS (`make npm-types`, which fetches TypeScript), and the demo
    # page's site checked in headless Chrome under its subpath (`make
    # pages-test`, which fetches xterm.js from jsDelivr), as pages.yml
    # checks it before a deploy, so a change that breaks the page fails
    # here rather than at a tag.  The wasm32
    # target goes on the toolchain rust-toolchain.toml names, installed
    # by the first cargo; the wasm-bindgen CLI is the release's prebuilt
    # binary at the crate's exact version, checked against its SHA-256
    # (scripts/install-wasm-bindgen.sh), in seconds and with no cache,
    # where `cargo install` would build it for minutes.  Chrome is the
    # runner image's google-chrome.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: |
          cargo --version
          rustup target add wasm32-unknown-unknown
      - run: |
          sh scripts/install-wasm-bindgen.sh "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen" >> "$GITHUB_PATH"
      - run: make wasm
      - run: make npm-test
      - run: make npm-types
      - run: make pages-test

  deny:
    # The dependencies' licenses and advisories against deny.toml, the
    # checks `make deny` makes locally, with the cargo-deny the action
    # pins rather than one built here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses advisories
          # The default features only, as deny.toml's [graph] says (the
          # action's default is --all-features, which takes in the
          # test-only unicorn feature), on rust-toolchain.toml's Rust.
          arguments: --workspace
          rust-version: "1.99.1"

  attribution:
    # No commit credits an AI assistant (AGENTS.md).  The checks the
    # commit-msg hook makes, of the messages and of the authors and
    # committers, over the whole history, for a commit made in a clone
    # without the hook; and the hook's own tests (`make hook-test`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git log --format=%B HEAD | sh .githooks/commit-msg --messages /dev/stdin
      - run: >-
          git log --format='%an <%ae>%n%cn <%ce>' HEAD
          | sh .githooks/commit-msg --identities /dev/stdin
      - run: make hook-test
