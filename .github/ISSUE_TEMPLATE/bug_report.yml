name: Bug report
description: Something the emulator does differently from the hardware or the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.  Please do not attach ROM images or
        firmware you may not redistribute; describe them, or give a
        small program that shows the problem.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CPU32 core (instructions, exceptions, timing)
        - SIM, QSM or GPT
        - Board files, nets, board time
        - Stock peripherals
        - GDB stub
        - Python bindings
        - Runner (mc683xx-run)
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate or package version, or the commit.
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest program, board file or Python snippet that shows
        it, and the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: |
        For hardware behavior: the manual or datasheet section that says
        what should happen (for example CPU32RM 6.2.1, QSMRM 4.3.1), or
        what a real part did.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust or Python version.
      render: text
