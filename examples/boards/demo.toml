# A generic board for a C firmware: a boot ROM, RAM, a 10 MHz clock
# divided to 1 PPS on IC1, OC2 counted, and the SCI on a console.
# `demo.bin` (with `demo.elf`, its symbols) is built by `make
# demo-image` from examples/firmware/demo; run it with
#
#   cargo run --release -p mc683xx-run -- examples/boards/demo.toml \
#       --bind console=stdio --seconds 3600 --pace realtime
#
# and type `h`.  (docs/board-files.md has the keys; docs/gdb-firmware.md
# debugs it under gdb.)

version = 1

[board]
name = "demo"
title = "A generic MC68331 board for a C firmware: ROM, RAM, 1 PPS and the SCI"
images = ["demo.bin"]

[chip]
type = "mc68331"
reference_hz = 32768

[[memory]]
name = "rom"
image = "demo.bin"
size = 0x10000
fill = 0xff
attach = [{ select = "CSBOOT", role = "read" }]

[[memory]]
name = "ram"
size = 0x10000
writable = true
attach = [{ select = "CS0" }]

[[peripheral]]
name = "reference"
type = "clock"
parameters = { hz = 10_000_000 }

[[peripheral]]
name = "pps"
type = "divider"
parameters = { divide = 10_000_000 }

[[peripheral]]
name = "oc2-counter"
type = "edge-counter"

[[net]]
name = "ten-megahertz"
type = "clock"
from = "reference.out"
to = ["pps.in"]

[[net]]
name = "one-pps"
type = "edge"
from = "pps.out"
to = ["chip.PGP0"]

[[net]]
name = "oc2"
type = "edge"
from = "chip.PGP4"
to = ["oc2-counter.in"]

[[net]]
name = "console-out"
type = "serial"
from = "chip.TXD"
to = ["external.console"]

[[net]]
name = "console-in"
type = "serial"
from = "external.console"
to = ["chip.RXD"]
