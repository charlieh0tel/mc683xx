[package]
name = "mc683xx-wasm"
description = "JavaScript bindings for the MC68331 emulator's boards, through WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Not published yet: whether it goes to npm and crates.io is open
# (PLAN.md, WebAssembly).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
js-sys = { version = "0.3.107", default-features = false }
mc683xx-board.workspace = true
mc683xx-cpu32.workspace = true
mc683xx-mc68331.workspace = true
mc683xx-modules.workspace = true
mc683xx-peripherals.workspace = true
thiserror = "2.0.21"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
mc683xx-target.workspace = true
