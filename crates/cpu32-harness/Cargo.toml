[package]
name = "cpu32-harness"
description = "Tests of the cpu32 core: SingleStepTests, a Musashi differential fuzzer, the smartclock firmware corpus, and a boot smoke test of whole images on the chip"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The differential fuzzer against Musashi.
musashi = ["cpu32-oracle/musashi"]
# The firmware corpus against Unicorn.
unicorn = ["cpu32-oracle/unicorn"]

[dependencies]
cpu32-oracle = { path = "../cpu32-oracle" }
mc683xx-cpu32.workspace = true
regex = "1.13.1"
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
mc683xx-mc68331.workspace = true
mc683xx-modules.workspace = true
