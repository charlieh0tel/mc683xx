[package]
name = "mc683xx-cpu32"
description = "The Motorola CPU32 core: instructions, exceptions and bus cycles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The library and the license texts: the tests and their goldens need
# the path-only snapshot-golden, which a package drops
# (docs/releasing.md).
include = ["/src", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
snapshot-golden = { path = "../snapshot-golden" }
