[package]
name = "mc683xx-target"
description = "A CPU32 under debug control: its registers, sizes, addresses and function codes, for the emulator and for silicon over BDM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The library and the license texts (docs/releasing.md).
include = ["/src", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
thiserror = { version = "2.0.21", default-features = false }

[features]
# Serialize and Deserialize for the types, as the core's snapshots
# need them.
serde = ["dep:serde"]

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
